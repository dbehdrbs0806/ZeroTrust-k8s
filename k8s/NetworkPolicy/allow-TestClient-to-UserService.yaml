apiVersion: networking.k8s.io/v1
kind: NetworkPolicy                 # NetworkPolicy resource type
metadata:
  name: allow-testclient-to-userservice
  namespace: zerotrust
spec:
  podSelector:
    matchLabels:
      app: user-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: test-client
      ports:
        - protocol: TCP
          port: 8080