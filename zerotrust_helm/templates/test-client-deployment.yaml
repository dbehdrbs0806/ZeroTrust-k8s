apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.testClient.name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.testClient.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.testClient.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.testClient.name }}
    spec:
      serviceAccountName: {{ .Values.testClient.serviceAccountName }}
      automountServiceAccountToken: false
      containers:
        - name: {{ .Values.testClient.name }}
          image: "{{ .Values.testClient.image.repository }}:{{ .Values.testClient.image.tag }}"
          imagePullPolicy: {{ .Values.testClient.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.testClient.service.port }}
          env:
            - name: USER_SERVICE_URL
              value: {{ .Values.testClient.env.userServiceUrl | quote }}
            - name: EVENT_SERVICE_URL
              value: {{ .Values.testClient.env.eventServiceUrl | quote }}