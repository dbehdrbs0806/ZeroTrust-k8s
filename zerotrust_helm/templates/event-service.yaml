apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.eventService.name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ .Values.eventService.name }}
  ports:
    - port: {{ .Values.eventService.service.port }}
      targetPort: {{ .Values.eventService.service.port }}
  type: ClusterIP