apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-test-client-to-user-service
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.userService.name }}
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/{{ .Release.Namespace }}/sa/{{ .Values.testClient.serviceAccountName }}"